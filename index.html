<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081c3b"><title>Python 基礎入門｜國立臺灣師範大學</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#eaf1ff;background:#08172e}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{height:60px;background:#0c2448;border-bottom:1px solid #284366;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}.brand{font-size:17px;font-weight:750;white-space:nowrap}.subtitle{font-size:12px;color:#a5bddc;font-weight:400}button{font:inherit;border:1px solid #3a5881;border-radius:9px;padding:9px 13px;background:#17375d;color:#f6f9ff;cursor:pointer}button:hover{background:#275182}button:focus-visible{outline:3px solid #80c6ff;outline-offset:2px}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.counter{font-variant-numeric:tabular-nums;color:#c7dcf4;font-size:14px;min-width:74px;text-align:center}main{max-width:1770px;margin:auto;padding:18px 18px 48px}.slide-shell{max-width:1480px;margin:auto}.slide-stage{width:100%;aspect-ratio:16/9;position:relative;background:#fff;box-shadow:0 10px 35px #0008;overflow:hidden}.slide-stage img{width:100%;height:100%;object-fit:contain;display:block}.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:13px}.hint{font-size:13px;color:#b0c5e3}.notes{margin:18px auto 0;max-width:1480px;border:1px solid #34547a;background:#10294c;border-radius:14px;padding:22px 26px;line-height:1.9;font-size:17px;white-space:pre-wrap}.notes h2{font-size:20px;margin:0 0 12px;color:#b9dcff}.notes[hidden],.overview[hidden]{display:none}.overview{max-width:1480px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}.thumb{padding:8px;text-align:left;background:#122d50}.thumb.active{border-color:#69b4ff;box-shadow:0 0 0 2px #69b4ff}.thumb img{width:100%;aspect-ratio:16/9;object-fit:contain;background:white}.thumb span{display:block;padding:6px 2px 2px;color:#d6e7fa;font-size:13px}.foot{margin:20px auto;text-align:center;color:#8da9c7;font-size:12px}body.fullscreen main{padding:0;max-width:none}body.fullscreen header,body.fullscreen .bottom,body.fullscreen .notes,body.fullscreen .foot{display:none!important}body.fullscreen .slide-shell{max-width:none}body.fullscreen .slide-stage{height:100vh;width:100vw;aspect-ratio:auto;box-shadow:none;background:#000}body.fullscreen .slide-stage img{object-fit:contain}body.fullscreen{overflow:hidden}@media(max-width:800px){header{height:auto;min-height:60px;flex-direction:column;align-items:stretch;padding:12px}.controls{justify-content:center}.brand{text-align:center}main{padding:12px 8px 30px}.hint{font-size:11px}.bottom{justify-content:center;flex-wrap:wrap}.notes{padding:18px;font-size:15px}}
</style></head>
<body><header><div class="brand">Python 基礎入門 <span class="subtitle">｜國立臺灣師範大學・林震煌 名譽教授</span></div><div class="controls"><button id="prev" aria-label="上一頁">← 上一頁</button><span class="counter" id="counter">1 / 39</span><button id="next" aria-label="下一頁">下一頁 →</button><button id="noteBtn" aria-pressed="false">顯示講稿</button><button id="overviewBtn" aria-pressed="false">頁面總覽</button><button id="fullBtn">全螢幕</button></div></header>
<main><section class="slide-shell" id="viewer"><div class="slide-stage" id="stage"><img id="slide" src="slides/slide-01.jpg" alt="Python 基礎入門，第 1 頁"></div><div class="bottom"><span class="hint">鍵盤 ← → 切換投影片；N 顯示講稿；F 全螢幕；Esc 離開</span><span class="counter" id="bottomCount">第 1 頁，共 39 頁</span></div></section><section id="notes" class="notes" hidden><h2 id="notesTitle">教師講稿</h2><div id="notesContent"></div></section><section class="overview" id="overview" hidden></section><div class="foot">本網站靜態運作，不需要伺服器或外部服務。所有投影片與講稿皆包含在網站檔案中。</div></main>
<script src="data.js"></script><script>
(()=>{'use strict';const data=window.SLIDES||[],total=data.length;let current=0,showNotes=false,showOverview=false;const $=id=>document.getElementById(id);const slide=$('slide');let touchX=null;
function render(){const d=data[current];if(!d)return;slide.src=d.image;slide.alt=`第 ${d.n} 頁：${d.title}`;$('counter').textContent=`${d.n} / ${total}`;$('bottomCount').textContent=`第 ${d.n} 頁，共 ${total} 頁`;$('notesTitle').textContent=`第 ${d.n} 頁｜教師講稿`;$('notesContent').textContent=d.note||'（此頁無講稿）';$('prev').disabled=current===0;$('next').disabled=current===total-1;document.title=`${d.n}/${total}｜Python 基礎入門`;history.replaceState(null,'',`#slide-${d.n}`);document.querySelectorAll('.thumb').forEach((el,i)=>el.classList.toggle('active',i===current));}
function go(n){current=Math.max(0,Math.min(total-1,n));render();if(showOverview){showOverview=false;updateOverview()}}function updateNotes(){$('notes').hidden=!showNotes;$('noteBtn').textContent=showNotes?'隱藏講稿':'顯示講稿';$('noteBtn').setAttribute('aria-pressed',showNotes)}function updateOverview(){$('overview').hidden=!showOverview;$('viewer').hidden=showOverview;$('overviewBtn').setAttribute('aria-pressed',showOverview);$('overviewBtn').textContent=showOverview?'返回投影片':'頁面總覽'}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('noteBtn').onclick=()=>{showNotes=!showNotes;updateNotes()};$('overviewBtn').onclick=()=>{showOverview=!showOverview;updateOverview()};$('fullBtn').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else document.exitFullscreen?.()};document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen',!!document.fullscreenElement));document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key.toLowerCase()==='n'){showNotes=!showNotes;updateNotes()}else if(e.key.toLowerCase()==='f'){$('fullBtn').click()}});$('stage').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});$('stage').addEventListener('touchend',e=>{if(touchX===null)return;const delta=e.changedTouches[0].screenX-touchX;if(Math.abs(delta)>60)go(current+(delta<0?1:-1));touchX=null},{passive:true});for(const [i,d] of data.entries()){const b=document.createElement('button');b.className='thumb';const im=document.createElement('img');im.src=d.image;im.loading='lazy';im.alt='';const label=document.createElement('span');label.textContent=`${d.n}. ${d.title.substring(0,32)}`;b.append(im,label);b.onclick=()=>go(i);$('overview').append(b)}const hit=location.hash.match(/slide-(\d+)/);if(hit)current=Math.max(0,Math.min(total-1,Number(hit[1])-1));render();updateNotes();updateOverview();window.addEventListener('hashchange',()=>{const m=location.hash.match(/slide-(\d+)/);if(m)go(Number(m[1])-1)});
})();
</script></body></html>
